<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Keeps a focused field above the pinned Send / Save bar when tabbing down the list. */
  html { scroll-padding-bottom: 64px; }
  body { margin: 0; padding: 12px; font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: inherit; cursor: pointer; }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button[aria-pressed="true"] { background: var(--figma-color-bg-selected); border-color: var(--figma-color-border-selected); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid var(--figma-color-border); border-radius: 4px; background: transparent; color: inherit; }
  .muted { color: var(--figma-color-text-secondary); }
  .warn { color: var(--figma-color-text-warning); }
  .row { padding: 8px 0; border-top: 1px solid var(--figma-color-border); }
  .row .text { margin: 2px 0 6px; word-break: break-word; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  select { font: inherit; max-width: 100%; }
  .ok { color: var(--figma-color-text-success, #14ae5c); }
  .error { color: var(--figma-color-text-danger); }
  /* The three steps: done ones get a check, the current one stands out. */
  .steps { display: flex; gap: 4px; margin: 0 0 12px; padding: 0; list-style: none; }
  .steps li { flex: 1; padding: 6px 4px; border-radius: 6px; text-align: center; font-size: 11px; color: var(--figma-color-text-secondary); background: var(--figma-color-bg-secondary); }
  /* Normal text on the pale "selected" fill, outlined in brand: readable whatever the theme's blue is. */
  .steps li.now { color: var(--figma-color-text); background: var(--figma-color-bg-selected); box-shadow: inset 0 0 0 1px var(--figma-color-border-selected); font-weight: 600; }
  .steps li.done { color: var(--figma-color-text); }
  /* Secondary actions read as links so the one main button per step stands out. */
  /* Normal text with an underline (the brand blue can fall under 4.5:1 at 12px); blue on hover. */
  button.link { padding: 0; border: 0; background: none; color: var(--figma-color-text); text-decoration: underline; }
  button.link:hover:not(:disabled) { color: var(--figma-color-text-brand); }
  .row-head { display: flex; gap: 6px; align-items: baseline; }
  .row-head .show { margin-left: auto; }
  button.link:disabled { color: var(--figma-color-text-disabled); text-decoration: none; }
  .loaded { margin: 0 0 8px; }
  .hint { font-weight: 600; }
  .summary { font-weight: 600; }
  /* Can't reach Retrans: a status, with the two ways forward. */
  .banner { padding: 8px 10px; margin: 0 0 10px; border-radius: 6px; background: var(--figma-color-bg-warning-tertiary, var(--figma-color-bg-secondary)); }
  .banner .bar { margin: 6px 0 0; }
  /* How much of the frame the drafts reach: information, not an error. */
  .info { padding: 8px 10px; margin: 8px 0; border-radius: 6px; background: var(--figma-color-bg-secondary); }
  .previewing { margin: 4px 0; }
  .lang-row { margin-top: 4px; }
  .lang select { margin-left: 4px; }
  .lang-row #reload { margin-left: 8px; }
  .sticky { position: sticky; bottom: 0; padding: 8px 0; margin: 0; background: var(--figma-color-bg); border-top: 1px solid var(--figma-color-border); }
</style>
</head>
<body>
<div id="app"></div>
<!-- SCRIPT -->
</body>
</html>

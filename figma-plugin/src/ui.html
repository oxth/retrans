<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: inherit; cursor: pointer; }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button[aria-pressed="true"] { background: var(--figma-color-bg-selected); border-color: var(--figma-color-border-selected); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid var(--figma-color-border); border-radius: 4px; background: transparent; color: inherit; }
  .muted { color: var(--figma-color-text-secondary); }
  .warn { color: var(--figma-color-text-warning); }
  .row { padding: 8px 0; border-top: 1px solid var(--figma-color-border); }
  .row .text { margin: 2px 0 6px; word-break: break-word; cursor: pointer; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .error { color: var(--figma-color-text-danger); }
</style>
</head>
<body>
<div id="app"></div>
<!-- SCRIPT -->
</body>
</html>

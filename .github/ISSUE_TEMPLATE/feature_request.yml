name: Feature request
description: Suggest an idea for Retrans
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: For example, other tools that do this well.
    validations:
      required: false

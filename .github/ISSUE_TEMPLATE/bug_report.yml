name: Bug report
description: Something in Retrans doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a next-i18next project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Retrans version
      placeholder: "0.3.0 — shown in Preferences / About"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - Windows 10
        - Windows 11
        - Other
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Project format
      options:
        - next-i18next (JSON)
        - Paraglide / inlang
        - TypeScript workspace
        - Figma Variables
        - New (format-free) project
        - Not related to a project
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI provider (if relevant)
      options:
        - Not using AI
        - Built-in local model
        - OpenAI
        - Claude (Anthropic)
        - OpenAI-compatible API
        - AI agent (ACP)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Please remove API keys and private text before pasting.
    validations:
      required: false

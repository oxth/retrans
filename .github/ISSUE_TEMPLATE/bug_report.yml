name: Bug report
description: Something in Retrans doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a next-i18next project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Retrans version
      placeholder: "0.5.1 — shown in Settings → About"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    # Not "format": GitHub (Rails) reads ?format= as the response type, so prefilling it gives HTTP 406.
    id: project-format
    attributes:
      label: Project format
      options:
        - next-i18next (JSON)
        - Paraglide / inlang
        - TypeScript workspace
        - Figma Variables
        - New (format-free) project
        - Not related to a project
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI provider (if relevant)
      options:
        - Not using AI
        - Built-in local model
        - OpenAI
        - Claude (Anthropic)
        - OpenAI-compatible API
        - AI agent (ACP)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Help → Report a Bug shows Retrans's log file (retrans.log); drag it here. It has no translation text or API keys, but check screenshots and anything you paste.
    validations:
      required: false

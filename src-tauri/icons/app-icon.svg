<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Retrans app icon: a two-language "resume" loop (white + teal arrows) around a globe.
       Source for `pnpm tauri icon src-tauri/icons/app-icon.svg`. 824px tile with macOS-style margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the drawing below is the 100-unit design scaled to the tile: x' = 100 + 8.24 * (x - 4) / 0.92 -->
  <g transform="translate(100 100) scale(8.9565) translate(-4 -4)">
    <path d="M22 50 A28 28 0 0 1 72 32" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 21 L79 33 L62 38 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M78 50 A28 28 0 0 1 28 68" fill="none" stroke="#99f6e4" stroke-width="8" stroke-linecap="round"/>
    <path d="M34 79 L21 67 L38 62 Z" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.5">
      <circle cx="50" cy="50" r="15"/>
      <ellipse cx="50" cy="50" rx="6.5" ry="15"/>
      <path d="M35 50 H65 M38 42 H62 M38 58 H62" stroke-linecap="round"/>
    </g>
  </g>
</svg>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the drawing below is the 100-unit design scaled to the tile: x' = 100 + 8.24 * (x - 4) / 0.92 -->
  <g transform="translate(100 100) scale(8.9565) translate(-4 -4)">
    <path d="M21.02 57.76 A30 30 0 0 1 65.00 24.02" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>

    <path d="M30.50 83.77 L25.36 68.68 L39.50 68.19 Z" fill="#99f6e4" stroke="#99f6e4" stroke-width="2" stroke-linejoin="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.2">
      <circle cx="50" cy="50" r="12.5"/>
      <ellipse cx="50" cy="50" rx="5.38" ry="12.5"/>
      <path d="M37.50 50 H62.50 M39.38 43.38 H60.62 M39.38 56.62 H60.62" stroke-linecap="round"/>
    </g>
  </g>

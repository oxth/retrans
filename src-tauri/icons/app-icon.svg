<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Retrans app icon: a key/value grid with one missing translation, drawn like the app's own
       missing cell (dashed red outline + status dot, see src/ui/Cell.tsx).
       Source for `pnpm tauri icon src-tauri/icons/app-icon.svg`. 824px tile with macOS-style margin.
       site/icon.svg is the same drawing cropped to the tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <!-- the tile gradient in drawing units, for the cut-out ring around the badge -->
    <linearGradient id="bgU" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- the drawing below is the 100-unit design scaled to the 824px tile -->
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>
    <g fill="#ffffff">
      <rect x="17.5" y="25" width="22" height="11" rx="4" opacity=".55"/>
      <rect x="44.5" y="25" width="33" height="11" rx="4"/>
      <rect x="17.5" y="44.5" width="22" height="11" rx="4" opacity=".55"/>
      <rect x="17.5" y="64" width="22" height="11" rx="4" opacity=".55"/>
      <rect x="44.5" y="64" width="33" height="11" rx="4"/>
    </g>
    <rect x="46" y="46" width="30" height="8" rx="3" fill="none" stroke="#fca5a5" stroke-width="3" stroke-dasharray="9 4.5"/>
    <circle cx="76.5" cy="45" r="5.5" fill="#f87171" stroke="url(#bgU)" stroke-width="3"/>
  </g>
</svg>

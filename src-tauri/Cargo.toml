[package]
name = "retrans"
version = "0.6.1"
description = "Desktop app for editing next-i18next, Paraglide, TypeScript and Figma translations"
authors = ["oxth"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "retrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.0"
notify-debouncer-mini = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2"] }
sha2 = "0.11"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time", "sync", "macros", "process"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
keyring = "4"
tauri-plugin-log = "2"
log = "0.4"

# Apple Silicon: llama.cpp runs on the GPU through Metal.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal"] }

# Intel Macs: CPU only. Their GPUs (often integrated) gain little from Metal, and a generic
# CPU build runs on every Intel Mac that macOS 11 supports.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false }

# Windows: every CPU variant as ggml-cpu-*.dll, the best one picked at runtime. build.rs reads
# DEP_LLAMA_BACKENDS_DIR, which only reaches direct dependents of llama-cpp-sys-2.
[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["dynamic-backends"] }
llama-cpp-sys-2 = "0.1.160"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
